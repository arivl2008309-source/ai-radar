<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 响应式 + PWA 元数据 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f0f2f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI 雷达">
<meta name="description" content="AI 雷达 — 每日 AI 资讯、行业应用、arXiv 论文、社区热帖，智能过滤，自动更新。">
<meta name="format-detection" content="telephone=no">
<!-- 禁止 iOS 自动识别电话号码 -->
<title>AI 雷达 — AI 资讯 · 行业应用 · 论文速递</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><text x='50' y='72' font-size='62' text-anchor='middle' fill='white'>%E2%9A%A1</text></svg>">
<link rel="stylesheet" href="styles.css?v=20260816a">
</head>
<body>
<div class="wrap">

  <!-- ===== 顶部栏 ===== -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">⚡</div>
      <div><h1>AI 雷达</h1><p class="tagline">AI 资讯 · 行业应用 · 论文速递 · 技术前沿</p></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="refreshBtn" title="刷新数据" aria-label="刷新数据">🔄</button>
      <button class="icon-btn" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
      <button class="icon-btn" id="favBtn" title="我的收藏" aria-label="我的收藏">★ 收藏 <b id="favCount">0</b></button>
    </div>
  </header>

  <!-- 最后更新时间 -->
  <div class="last-updated" id="lastUpdated" role="status" aria-live="polite">
    <span class="lu-dot"></span>
    <span class="lu-text">正在加载…</span>
    <button class="refresh-btn" id="luRefresh" title="立即刷新">刷新</button>
  </div>

  <!-- 今日头条跑马灯 -->
  <div class="ticker" id="tickerWrap"><span class="ticker-label">🔥 今日头条</span>
    <div class="ticker-view"><div class="ticker-track" id="tickerTrack"></div></div>
  </div>

  <!-- 主标签（可横滑） -->
  <nav class="tabs" id="mainTabs" role="tablist">
    <button class="tab active" data-tab="news" role="tab" aria-selected="true">AI 资讯</button>
    <button class="tab" data-tab="industry" role="tab" aria-selected="false">行业应用</button>
    <button class="tab" data-tab="community" role="tab" aria-selected="false">社区热帖</button>
    <button class="tab" data-tab="papers" role="tab" aria-selected="false">arXiv 论文</button>
  </nav>

  <!-- 工具栏：搜索 + 时间窗 -->
  <div class="toolbar" id="toolbar">
    <div class="search-box">
      <span class="search-ico" aria-hidden="true">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索关键词（如 OpenAI / Agent / RAG）…" autocomplete="off" aria-label="搜索">
    </div>
    <select id="timeSelect" class="select" title="时间范围" aria-label="时间范围">
      <option value="24">24 小时</option>
      <option value="72" selected>3 天</option>
      <option value="168">7 天</option>
      <option value="720">30 天</option>
    </select>
  </div>

  <!-- 智能过滤栏 -->
  <div class="filterbar" id="filterBar" role="group" aria-label="过滤选项">
    <span class="fb-label">智能过滤</span>
    <button class="ftoggle active" data-f="smart" role="switch" aria-checked="true">去垃圾</button>
    <button class="ftoggle active" data-f="dedup" role="switch" aria-checked="true">去重</button>
    <button class="ftoggle" data-f="quality" role="switch" aria-checked="false">仅优质</button>
  </div>

  <!-- 分类筛选（仅资讯标签） -->
  <div class="chips" id="catChips" role="group" aria-label="分类筛选">
    <button class="chip active" data-cat="all" role="radio" aria-checked="true">全部</button>
    <button class="chip" data-cat="ai-models" role="radio" aria-checked="false">模型发布</button>
    <button class="chip" data-cat="ai-products" role="radio" aria-checked="false">产品更新</button>
    <button class="chip" data-cat="industry" role="radio" aria-checked="false">行业动态</button>
    <button class="chip" data-cat="paper" role="radio" aria-checked="false">论文研究</button>
    <button class="chip" data-cat="tip" role="radio" aria-checked="false">技巧观点</button>
  </div>

  <!-- 状态条 -->
  <div class="status" id="status" role="status" aria-live="polite"></div>

  <!-- 内容区（卡片网格） -->
  <main class="grid" id="content" role="main"></main>

  <!-- 页脚 -->
  <footer class="foot">
    数据来源：<a href="https://aihot.virxact.com" target="_blank" rel="noopener">AI HOT</a> ·
    <a href="https://arxiv.org" target="_blank" rel="noopener">arXiv</a> ·
    <a href="https://news.ycombinator.com" target="_blank" rel="noopener">Hacker News</a> ·
    仅供学习参考，版权归原作者所有<br>
    <span style="opacity:.6; margin-top:4px; display:inline-block;">AI Radar v6 · 自动更新</span>
  </footer>
</div>
<script src="app.js?v=20260816a"></script>
<script>
  // 注册 Service Worker，使网页可「添加到主屏幕」并离线打开界面
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* 注册失败不影响正常使用 */ });
    });
  }
</script>
</body>
</html>
